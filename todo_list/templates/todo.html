{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Google Fonts -->
    <link rel="stylesheet" href="http://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {# <link rel="stylesheet" href="{% static 'css/index.css' %}"> #}

    <!-- Font Awesome -->
    <script src="http://kit.fontawesome.com/cb792c0850.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="signup-login">
        <div class="vishal">
            <h1>Hello {{ user }}</h1>
        </div>

        <div class="signup-box">
            <div class="heading">Get Things Done ?</div>
            <a href="{% url 'logout' %}">
                <i class="fa-solid fa-right-from-bracket"></i>
            </a>


            <form method="post">
                {% csrf_token %}
                <input type="text" name="title" required placeholder="Add Today's Task">
                <input type="submit" class="submit-button" value="Add Task">
            </form>

          {% for srno, todo in res %}
        <div class="Todo">
           <h5>{{ srno }}</h5>
           <p>{{ todo.title }}</p>
           <div>
            <a href="/edit_todo/{{todo.srno}}"><i class="fa-solid fa-pen-to-square"></i></a>

            <a href="{% url 'delete_todo' todo.srno %}">
                <i class="fa-solid fa-trash"></i>
            </a>

            </div>
        </div>
{% endfor %}


        </div>
        </div>
</body>
</html>
