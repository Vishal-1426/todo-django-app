{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <link rel="stylesheet" href="http://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="{% static 'css/index.css' %}">
</head>

<body>
  <div class="signup-login">
      <div class="signup-box">

        <form method="post" action="/login/">
          {% csrf_token %}

          {% if messages %}
           <div style="margin-bottom: 10px;">
              {% for message in messages %}
                <p style="color: red; font-weight: bold;">{{ message }}</p>
             {% endfor %}
           </div>
          {% endif %}


          <div class="heading">Login</div>
          <div class="line"></div>

          <div class="field">
            <b>Username</b>
            <input type="text" required class="inp" placeholder="Enter your Username" name="fnn">
          </div>

          <div class="field">
            <b>Password</b>
            <input type="password" required class="inp" name="pwd">
          </div>

          <div class="field">
            <input type="submit" class="submit-button" value="Login">
          </div>

          <div class="feild">
            <b>Don't have an account?</b><br>
            <a class="anc" href="/">Create Account</a>
          </div>

        </form>

      </div>
  </div>
</body>
</html>
