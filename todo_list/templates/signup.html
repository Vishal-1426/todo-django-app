{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignUp</title>
  <link rel="stylesheet" href="http://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" />

  <link rel="stylesheet" href="{% static 'css/index.css' %}">

  <script src="http://kit.fontawesome.com/cb792c0850.js" crossorigin="anonymous"></script>    
</head>
<body>

    <div class="signup-login">
      <div class="signup-box">
        <form method="post">
          {% csrf_token %}
          <div class="heading">
            Signup
            
          </div>

          <div class="line"></div>
          <div class="field">
          <b>Username</b>
          <input type="text" required class="inp" placeholder="Enter your Username" name="fnn">

          <div class="field">
            <b>Email</b>
            <input type="Email" required class="inp" name="email">
            <div class="field">
              <b>Password</b>
              <input type="Password" class="inp" name="pwd" required>
            </div>

            <div class="field">
              <input type="submit" class="submit-button" value="SignUp">
            </div>

            <div class="feild">
              <b>Already have an account?</b>
              <br>
              <a class="anc" href="/login"></a>
            </div>

          </div>
        </form>
      </div>
    </div>


</div>
</body>
</html>
